<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="description" content="TeeXaa® — تیکسا، رابط مدرن صرافی و مدیریت دارایی">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>TeeXaa® | تیکسا</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-glow glow-a"></div>
    <div class="splash-glow glow-b"></div>
    <div class="splash-glow glow-c"></div>
    <div class="splash-content">
      <img src="logo-type.png" class="splash-wordmark" alt="TeeXaa">
      <div class="splash-line"></div>
      <span>هوشمندانه معامله کن</span>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <img src="logo-app.png" alt="TeeXaa" class="brand-logo">
        <div>
          <strong>تیکسا</strong>
          <small>TeeXaa®</small>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" data-page="notifications" aria-label="اعلان‌ها">♢<span class="dot"></span></button>
        <button class="avatar" data-page="profile">ت</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active"><span>⌂</span><b>خانه</b></button>
      <button data-page="markets" class="nav-item"><span>◫</span><b>بازار</b></button>
      <button data-page="trade" class="nav-item trade-nav"><span>＋</span><b>معامله</b></button>
      <button data-page="wallet" class="nav-item"><span>▣</span><b>کیف پول</b></button>
      <button data-page="more" class="nav-item"><span>•••</span><b>بیشتر</b></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"></div>
  <script src="app.js"></script>
</body>
</html>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
